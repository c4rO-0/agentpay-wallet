name: Publish Wallet to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: wallet-npm-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'c4rO-0/agentpay-wallet' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - name: Check release tag and package version
        run: |
          node --input-type=module <<'JS'
          import {readFileSync, appendFileSync} from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const tag = process.env.GITHUB_REF_NAME;
          if (process.env.GITHUB_REF_TYPE !== 'tag' ||
              !/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag ?? '') ||
              pkg.name !== '@c4roa0/agentpay-wallet' || pkg.private ||
              tag !== `v${pkg.version}`) {
            throw Error('Release tag must be vX.Y.Z and match package.json.');
          }
          appendFileSync(process.env.GITHUB_ENV, `RELEASE_VERSION=${pkg.version}\n`);
          JS
      - name: Prepare package managers
        run: |
          npm install --global npm@11.5.1
          corepack enable
          corepack prepare pnpm@10.0.0 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify Wallet behavior
        run: |
          pnpm build
          node --test --test-concurrency=1 dist/test/*.test.js
      - name: Verify and retain the standalone package
        run: node scripts/test-package.mjs artifacts/npm
      - name: Publish with npm trusted identity
        run: npm publish "artifacts/npm/c4roa0-agentpay-wallet-${RELEASE_VERSION}.tgz" --access public --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Verify public registry integrity
        run: node scripts/verify-npm-release.mjs "artifacts/npm/c4roa0-agentpay-wallet-${RELEASE_VERSION}.tgz" "$RELEASE_VERSION"
